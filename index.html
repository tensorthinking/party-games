<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Birthday Party Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1033;--card:#ffffff12;--card2:#ffffff1f;--line:#ffffff2a;
  --text:#fff;--muted:#cbbfe8;--pink:#ff4fa3;--yellow:#ffd23f;--teal:#2de1c2;--orange:#ff8a3d;--red:#ff5470;--green:#45e07a;
  --art:min(calc(100vh - 120px), calc(100vw - 360px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0%,#3b1d6e 0%,var(--bg) 55%) fixed;background-color:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
h1,h2,h3,.fun{font-family:"Baloo 2",system-ui,sans-serif;margin:0;line-height:1.05}
button{font-family:"Baloo 2",system-ui,sans-serif;font-weight:700;border:0;border-radius:16px;padding:14px 22px;font-size:20px;cursor:pointer;color:#1a1033;background:var(--yellow);box-shadow:0 5px 0 #c99a00;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #c99a00}
button.ghost{background:var(--card2);color:#fff;box-shadow:none}
button.pink{background:var(--pink);color:#fff;box-shadow:0 5px 0 #b3236c}
button.teal{background:var(--teal);box-shadow:0 5px 0 #13917c}
button:disabled{opacity:.45;pointer-events:none}
input,textarea{font:inherit;font-size:20px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#00000040;color:#fff;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--yellow)}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center}
.wrap{flex-wrap:wrap}
.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.small{font-size:15px;padding:9px 14px;border-radius:12px;box-shadow:none}

/* HOST */
.host{display:grid;grid-template-columns:1fr 290px;gap:20px;padding:18px 22px;min-height:100vh}
.host-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.host-top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.party-title{font-size:38px;background:linear-gradient(90deg,var(--yellow),var(--pink),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.stage.tight{justify-content:flex-start;gap:12px}
.side{display:flex;flex-direction:column;gap:10px}
.board-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:#ffffff0d;font-weight:600}
.board-row .sc{margin-left:auto;font-family:"Baloo 2";font-size:22px;color:var(--yellow)}
.board-row.done{outline:2px solid var(--green)}
.emo{font-size:24px;width:32px;text-align:center}
.big-q{font-size:48px;max-width:1100px}
.timer{font-family:"Baloo 2";font-size:28px;font-weight:800;padding:4px 16px;border-radius:999px;background:var(--card2);white-space:nowrap}
.timer.low{background:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--card2);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.pill.x2{background:var(--orange);color:#1a1033;animation:pulse .6s infinite alternate}
.gbar{display:flex;align-items:center;gap:10px;width:100%;flex-wrap:wrap}
.gbar .sp{flex:1}
.hint{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:34px;font-weight:800;letter-spacing:.08em;white-space:pre;color:var(--yellow)}
.hint .n{font-family:Inter;font-size:16px;color:var(--muted);letter-spacing:0;margin-left:10px;font-weight:600}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:100%;max-width:1150px}
.game-tile{cursor:pointer;text-align:left;border-radius:22px;padding:22px;background:var(--card);border:2px solid var(--line);transition:transform .15s,border-color .15s}
.game-tile:hover{transform:translateY(-4px);border-color:var(--yellow)}
.game-tile .ic{font-size:44px}
.game-tile h3{font-size:28px;margin:6px 0}
.game-tile.played{opacity:.65}
.art{width:var(--art);height:var(--art);border-radius:24px;background:#fffdf5;box-shadow:0 10px 40px #0006;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.art svg{width:94%;height:94%}
.art canvas{width:100%;height:100%;display:block}
.art .over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1033cc;font-family:"Baloo 2";font-size:min(30vh,220px);font-weight:800;color:var(--yellow)}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:var(--art)}
.choices div{background:var(--card2);border-radius:14px;padding:10px;font-family:"Baloo 2";font-weight:700;font-size:22px}
.choices div.ok{background:var(--green);color:#10331d}
.feed{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:hidden}
.feed span{background:#ffffff14;border-radius:10px;padding:5px 10px;font-weight:600;font-size:15px;animation:pop .3s;text-align:left}
.feed span.ok{background:var(--green);color:#10331d}
.feed span.close{background:var(--orange);color:#1a1033}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;width:100%;max-width:1150px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;font-size:28px;font-weight:700;font-family:"Baloo 2";text-align:left;position:relative}
.opt.truth{border-color:var(--green);background:#45e07a2e}
.opt .who{font-family:Inter;font-size:15px;color:var(--muted);font-weight:600;margin-top:6px}
.opt .tag{position:absolute;top:-12px;right:14px;font-size:14px;padding:3px 10px;border-radius:999px;background:var(--green);color:#10331d;font-family:Inter}
.res-list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:760px}
.res-list .board-row{font-size:21px}
.qr{background:#fff;padding:14px;border-radius:18px;display:inline-block}
.join-url{font-family:"Baloo 2";font-size:22px;word-break:break-all}
.code{font-family:"Baloo 2";font-size:64px;letter-spacing:.12em;color:var(--yellow)}
.lobby-players{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px}
.chip{background:var(--card2);border-radius:999px;padding:8px 16px;font-weight:700;font-size:20px;animation:pop .3s;cursor:pointer}
.big-emoji{font-size:110px;line-height:1}
.countdown{font-family:"Baloo 2";font-size:min(40vh,300px);font-weight:800;color:var(--yellow);line-height:1;animation:pop .4s}
.podium{display:flex;align-items:flex-end;gap:18px;justify-content:center}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px}
.pod .blk{width:170px;border-radius:18px 18px 0 0;display:flex;align-items:flex-start;justify-content:center;font-family:"Baloo 2";font-size:44px;font-weight:800;padding-top:10px;color:#1a1033}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.conn{font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:6px}
.dot.on{background:var(--green)}
.setup{max-width:760px;width:100%;text-align:left;display:flex;flex-direction:column;gap:18px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.setrow .lbl{font-weight:700;font-size:19px}
.setrow .lbl small{display:block;font-weight:500;font-size:14px;color:var(--muted)}
.seg{display:flex;background:#00000040;border-radius:14px;padding:4px;gap:4px}
.seg button{box-shadow:none;background:transparent;color:#fff;font-size:17px;padding:8px 16px;border-radius:10px}
.seg button.on{background:var(--yellow);color:#1a1033}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{box-shadow:none;background:var(--card2);color:#fff;width:44px;height:44px;padding:0;font-size:24px;border-radius:12px}
.stepper .v{font-family:"Baloo 2";font-size:28px;font-weight:800;min-width:70px;text-align:center}
.uploads{display:flex;gap:8px;flex-wrap:wrap}
.uploads span{background:var(--card2);border-radius:999px;padding:4px 10px;font-size:13px}
.uplbtn{background:var(--card2);border-radius:12px;padding:9px 14px;cursor:pointer;font-family:"Baloo 2";font-weight:700;font-size:16px;display:inline-block}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
#reacts{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
#reacts span{position:absolute;bottom:-60px;font-size:54px;animation:floatup 2.6s ease-out forwards}
@keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-15vh) scale(1.1)}100%{transform:translateY(-95vh) scale(1);opacity:0}}
#toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:var(--red);color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;z-index:60;display:none;font-size:18px}

/* PLAYER */
.phone{max-width:520px;margin:0 auto;padding:16px 16px 30px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
.phone-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.phone .me{font-weight:700;font-size:18px}
.phone .score{font-family:"Baloo 2";font-size:22px;color:var(--yellow)}
.phone-body{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center}
.phone h2{font-size:30px}
.phone .hint{font-size:26px;text-align:center;white-space:pre-wrap}
.secret{border-radius:22px;padding:28px 18px;text-align:center;background:linear-gradient(135deg,var(--teal),#2b8cff);color:#062a2c}
.secret.imp{background:linear-gradient(135deg,var(--red),var(--pink));color:#fff}
.secret .w{font-family:"Baloo 2";font-size:46px;font-weight:800;line-height:1.05}
.vote-btns{display:flex;flex-direction:column;gap:10px}
.vote-btns button{text-align:left;background:var(--card2);color:#fff;box-shadow:none;border:2px solid var(--line);font-size:21px}
.vote-btns button.sel{background:var(--yellow);color:#1a1033;border-color:var(--yellow)}
.pick4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick4 button{background:var(--card2);color:#fff;box-shadow:none;border:2px solid var(--line);font-size:20px;min-height:76px;padding:10px}
.status{border-radius:18px;padding:18px;text-align:center;font-weight:700;font-size:20px;background:var(--card2)}
.status.ok{background:var(--green);color:#10331d}
.status.bad{background:var(--red)}
.status.close{background:var(--orange);color:#1a1033}
.emoji-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emoji-pick button{font-size:28px;padding:8px 0;background:var(--card2);box-shadow:none;border:2px solid transparent}
.emoji-pick button.sel{border-color:var(--yellow);background:#ffd23f33}
.reacts{display:flex;justify-content:space-between;gap:6px;margin-top:auto}
.reacts button{flex:1;font-size:26px;padding:8px 0;background:var(--card);box-shadow:none;border-radius:14px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.rpanel{width:100%;flex:1;min-height:62vh;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Baloo 2";font-weight:800;font-size:min(14vw,140px);color:#fff;gap:10px}
.rpanel .rsub{font-family:Inter;font-size:24px;font-weight:600;opacity:.9}
.rpanel.red,.rbtn.red{background:#e0244a}
.rpanel.green,.rbtn.green{background:#18c964;color:#062a14}
.rpanel.flash,.rbtn.flash{color:#1a1033}
.rbtn{min-height:56vh;border-radius:28px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:"Baloo 2";font-weight:800;font-size:52px;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation;text-align:center;line-height:1.1}
.rbtn small{display:block;font-family:Inter;font-size:16px;font-weight:600;margin-top:8px}
.rbtn.done{background:var(--card2)}
.pencard{background:linear-gradient(135deg,#ff5470,#ff4fa3);border-radius:24px;padding:24px 28px;max-width:1050px;width:100%;animation:pop .4s}
.penq{font-family:"Baloo 2";font-size:min(5vw,54px);font-weight:800;margin:14px 0;line-height:1.15}
.tcard{background:#fff;color:#1a1033;border-radius:22px;padding:28px 34px;font-family:"Baloo 2";font-weight:800;font-size:min(6vw,60px);max-width:1000px;box-shadow:0 10px 40px #0006;line-height:1.15}
.tcard.sm{font-size:30px;padding:16px 22px}
.tcanvas{width:min(62vh,640px);height:min(62vh,640px);background:#fff;border-radius:22px;box-shadow:0 10px 40px #0006}
.chaingrid{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:1200px}
.chaingrid .cell{width:170px;background:#ffffff14;border-radius:14px;padding:8px}
.chaingrid canvas{width:154px;height:154px;background:#fff;border-radius:10px;display:block}
.chaingrid .ctext{background:#fff;color:#1a1033;border-radius:10px;height:154px;display:flex;align-items:center;justify-content:center;padding:10px;font-family:"Baloo 2";font-weight:700;font-size:18px;overflow:hidden}
.chaingrid .cby{font-size:13px;margin-top:6px;color:var(--muted)}
.wall{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:1250px}
.wish{color:#3a2a00;border-radius:16px;padding:16px 18px;max-width:320px;font-family:"Baloo 2";font-weight:700;font-size:22px;box-shadow:0 6px 20px #0005;animation:pop .5s;line-height:1.2;text-align:left}
.wish .from,.wishbig .from{font-family:Inter;font-size:15px;opacity:.7;margin-top:8px;font-weight:600}
.wishbig{color:#3a2a00;border-radius:26px;padding:40px 50px;max-width:1050px;font-family:"Baloo 2";font-weight:800;font-size:min(5.5vw,62px);line-height:1.15;box-shadow:0 14px 50px #0007;animation:pop .6s}
.wishbig .from{font-size:24px}
.padwrap canvas{width:100%;aspect-ratio:1/1;height:auto;background:#fff;border-radius:16px;touch-action:none;display:block}
.padtools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center}
.sw{width:36px;height:36px;padding:0;border-radius:50%;box-shadow:none;border:3px solid #ffffff44;font-size:16px}
.sw.on{border-color:var(--yellow);transform:scale(1.15)}
.dword{background:var(--yellow);color:#1a1033;border-radius:14px;padding:10px 14px;text-align:center;font-size:20px}
.dword b{font-family:"Baloo 2";font-size:28px}
textarea{resize:none}
@media (max-width:900px){.host{grid-template-columns:1fr}:root{--art:min(calc(100vh - 160px),calc(100vw - 44px))}.big-q{font-size:32px}.choices{grid-template-columns:1fr 1fr}}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const uid = () => Math.random().toString(36).slice(2,10);
const norm = s => String(s||"").toLowerCase().normalize("NFKD").replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
const tight = s => norm(s).replace(/ /g,"").replace(/(es|s)$/,"");
const cap = s => String(s).replace(/\b\w/g,c=>c.toUpperCase());
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function tolFor(a){ return a.length >= 9 ? 2 : a.length >= 4 ? 1 : 0; }
function matches(guess, answers){
  const g = tight(guess); if (!g) return false;
  return answers.some(ans => { const a = tight(ans);
    if (g === a) return true;
    if (lev(g,a) <= tolFor(a)) return true;
    if (a.length >= 4 && g.includes(a)) return true;
    return false; });
}
function isClose(guess, answers){
  const g = tight(guess); if (g.length < 3) return false;
  return answers.some(ans => { const a = tight(ans); return a.length>=4 && lev(g,a) <= tolFor(a)+2; });
}

let MUTED=false;
function tone(freq,dur=.15,type="sine",vol=.2,delay=0){if(MUTED)return;const ac=audio();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,ac.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+delay+dur);o.connect(g).connect(ac.destination);o.start(ac.currentTime+delay);o.stop(ac.currentTime+delay+dur+.05);}

let S = null;

function startHost(room){

function persist(){ const g=S.game; S.game=null; lsSet("bday-host-"+S.room, S); S.game=g; }

function playersArr(){ return Object.entries(S.players).map(([id,p])=>({id,...p})).filter(p=>!p.kicked); }
function activeIds(){ return playersArr().map(p=>p.id); }
function addScore(id, pts){
  if(!S.players[id]) return 0;
  const g=S.game; const p=Math.round(pts*(g&&g.mult||1));
  S.players[id].score=(S.players[id].score||0)+p;
  if(g){ g.gained[id]=(g.gained[id]||0)+p; }

}

let lastReact={};
function hostOnMsg(m){
  if(!m||!m.id)return;
  if(m.k==="join"){
    const isNew = !S.players[m.id];
    if(S.players[m.id]&&S.players[m.id].kicked) return;
    S.players[m.id] = Object.assign(S.players[m.id]||{score:0}, {name:String(m.name||"Player").slice(0,16), emoji:m.emoji||"🎈", seen:Date.now()});
    if(isNew){ SFX.join(); updateHostLive(); const gb=$("#go-btn"); if(gb) gb.disabled=false; }
    persist(); broadcast(); return;
  }
  if(m.k==="ping"){ if(S.players[m.id]) S.players[m.id].seen=Date.now(); return; }
  if(m.k==="react"){ const now=Date.now(); if(now-(lastReact[m.id]||0)<350) return; lastReact[m.id]=now; if(REACTS.includes(m.e)) floatReact(m.e); return; }
  if(m.k==="draw"||m.k==="needtask"){ const g=S.game; if(g&&EXT[g.type]&&EXT[g.type].msg) EXT[g.type].msg(g,m); return; }
  if(m.k==="ans"){ if(!S.players[m.id]||S.players[m.id].kicked)return; handleAnswer(m.id, m.rid, m.v); }
}

/* -------- public state for phones -------- */
let bTimer=null;
function broadcast(){ clearTimeout(bTimer); bTimer=setTimeout(()=>send({k:"state", st:publicState()}),60); }
function isGuess(g){ return g && (g.type==="sketch"||g.type==="pixel"); }
function publicState(){
  const g=S.game, out={title:S.title, phase:S.phase, players:playersArr().map(p=>({id:p.id,name:p.name,emoji:p.emoji,score:p.score||0}))};
  if(S.phase==="gameover"&&S.lastGained) out.gained=S.lastGained;
  if(g){
    out.g={type:g.type, rid:g.rid, step:g.step, idx:g.idx, total:g.total, mult:g.mult, left:g.deadline?Math.max(0,Math.round((g.deadline-Date.now())/1000)):null, priv:{}};
    const ids=activeIds();
    if(EXT[g.type]) EXT[g.type].pub(g,out.g,ids);
    if(isGuess(g)){
      out.g.mode=g.cfg.mode; out.g.hint=g.hint||"";
      if(g.cfg.mode==="pick"&&g.step!=="ready") out.g.choices=g.choices;
      ids.forEach(id=>{const r=g.res[id]; out.g.priv[id]= r?{ok:!r.wrong,wrong:!!r.wrong,pts:r.pts}:{tries:(g.tries[id]||0)};});
      if(g.step==="reveal") out.g.answer=g.answerLabel;
      if(g.type==="pixel") out.g.team=g.item.team;
    }
    if(g.type==="imposter"){
      ids.forEach(id=>{ out.g.priv[id] = (g.inRound.includes(id)) ? (id===g.imp?{imp:true,cat:g.cfg.diff==="hard"?null:g.cat}:{word:g.word,cat:g.cat}) : {late:true}; if(g.votes[id])out.g.priv[id].voted=g.votes[id]; });
      out.g.cands = g.inRound.map(id=>({id,name:S.players[id]?.name,emoji:S.players[id]?.emoji}));
      out.g.first = g.first;
      if(g.step==="reveal"){ out.g.imp=g.imp; out.g.word=g.word; out.g.caught=g.caught; }
    }
    if(g.type==="closest"){
      if(g.step!=="ready"){ out.g.q=g.item.q; out.g.u=g.item.u; }
      ids.forEach(id=>{ out.g.priv[id] = g.ans[id]!=null?{v:g.ans[id], pts:g.pts?.[id]}:{}; });
      if(g.step==="reveal") out.g.answer=g.item.a;
    }
    if(g.type==="fakefact"){
      if(g.step!=="ready") out.g.q=g.item.q;
      ids.forEach(id=>{ out.g.priv[id] = {wrote:!!g.lies[id], voted:g.votes[id]||null, pts:g.pts?.[id]}; });
      if(g.step==="vote"||g.step==="reveal") out.g.opts=g.opts.map(o=>({id:o.id,text:o.text,own:o.authors}));
      if(g.step==="reveal") out.g.truthId=g.opts.find(o=>o.truth).id;
    }
  }
  return out;
}

/* -------- game flow -------- */
function openSetup(type){ audio(); S.phase="setup"; S.setupType=type; renderHost(true); broadcast(); }
function setCfg(k,v){ S.settings[S.setupType][k]=v; persist(); renderHost(true); }
function stepCfg(k,delta,min,max){ const c=S.settings[S.setupType]; c[k]=Math.max(min,Math.min(max,(c[k]||0)+delta)); persist(); renderHost(true); }
function toggleDouble(){ S.settings.global.double=!S.settings.global.double; persist(); renderHost(true); }

function buildPool(type,cfg){
  if(EXT[type]) return EXT[type].pool?EXT[type].pool(cfg):null;
  if(type==="sketch"){ const ok={easy:[1],medium:[1,2],hard:[2,3]}[cfg.diff]; return shuffle(DRAWINGS.filter(d=>ok.includes(d.d))); }
  if(type==="pixel"){
    const own=shuffle(customFoods);
    return own.concat(shuffle(FOODS));
  }
  if(type==="closest"){ const ok={easy:[1],medium:[2,1],hard:[3,2]}[cfg.diff];
    const a=shuffle(CLOSEST.filter(q=>q.d===ok[0])), b=shuffle(CLOSEST.filter(q=>q.d===ok[1])); return a.concat(b); }
  if(type==="fakefact") return shuffle(FAKEFACTS);
  return null;
}
function maxRounds(type){
  if(EXT[type]) return GAMES[type].rmax||10;
  const cfg=S.settings[type]||{};
  if(type==="sketch"||type==="closest") return Math.max(1,buildPool(type,cfg).length);
  if(type==="pixel") return FOODS.length+customFoods.length;
  if(type==="fakefact") return FAKEFACTS.length;
  return 10;
}
function startGame(type){
  audio();
  const def=GAMES[type], cfg=Object.assign({},S.settings[type]);
  const n=activeIds().length;
  if(def.minPlayers&&n<def.minPlayers){ toast(`${def.name} needs at least ${def.minPlayers} players. ${n} joined so far.`); SFX.buzz(); return; }
  if(n<1){ toast("Nobody has joined yet!"); return; }
  const pool=buildPool(type,cfg);
  const total=EXT[type]&&EXT[type].total?EXT[type].total(cfg,n):Math.max(1,Math.min(cfg.rounds, pool?pool.length:99));
  S.phase="game";
  S.game={type, cfg, idx:0, total, pool, gained:{}};
  if(!S.played.includes(type)) S.played.push(type);
  SFX.start(); nextRound();
}
function nextRound(){
  const g=S.game; g.idx++;
  if(g.idx>g.total){ endGame(); return; }
  g.rid=uid(); g.mult=(S.settings.global.double&&g.total>1&&g.idx===g.total)?2:1;
  const ids=activeIds(), now=Date.now();
  if(EXT[g.type]){ EXT[g.type].round(g,now,ids); if(S.game!==g) return; renderHost(true); broadcast(); return; }
  if(isGuess(g)){
    g.item=g.pool[(g.idx-1)%g.pool.length]; g.res={}; g.tries={}; g.feed=[]; g.hint="";
    g.answerLabel = cap(g.item.a[0]);
    const letters=[...g.answerLabel].map((c,i)=>c===" "?-1:i).filter(i=>i>=0);
    g.revealOrder=shuffle(letters);
    g.hintMax = g.cfg.mode==="pick" ? -1 : {easy:Math.ceil(letters.length*0.5),medium:Math.ceil(letters.length*0.25),hard:-1}[g.cfg.diff];
    g.order = g.cfg.diff==="hard" ? shuffle(g.item.p||[]) : (g.item.p||[]);
    g.zoomC=[150+Math.random()*180,150+Math.random()*180];
    if(g.cfg.mode==="pick"){
      const labels=[...new Set(g.pool.map(x=>cap(x.a[0])))].filter(l=>tight(l)!==tight(g.answerLabel));
      g.choices=shuffle([g.answerLabel].concat(shuffle(labels).slice(0,3)));
    }
    g.hint=hintText(g,0);
    g.after="play"; g.dur=g.cfg.time*1000;
  }
  if(g.type==="imposter"){
    if(ids.length<3){ toast("Imposter needs at least 3 players."); S.phase="menu"; S.game=null; renderHost(true); broadcast(); return; }
    const cats=g.cfg.diff==="easy"?EASY_IMP:Object.keys(IMPOSTER); g.cat=pick(cats); g.word=pick(IMPOSTER[g.cat]);
    g.inRound=shuffle(ids); g.imp=pick(g.inRound); g.first=pick(g.inRound.filter(i=>i!==g.imp)); g.votes={};
    g.step="clues"; g.start=now; g.deadline=now+g.cfg.time*1000;
    SFX.start(); renderHost(true); broadcast(); return;
  }
  if(g.type==="closest"){ g.item=g.pool[g.idx-1]; g.ans={}; g.pts=null; g.after="play"; g.dur=g.cfg.time*1000; }
  if(g.type==="fakefact"){ g.item=g.pool[g.idx-1]; g.lies={}; g.votes={}; g.pts=null; g.opts=[]; g.after="write"; g.dur=g.cfg.time*1000; }
  g.step="ready"; g.readyEnd=now+3200; g.deadline=null; lastCd=null;
  renderHost(true); broadcast();
}
function hintText(g,t){
  if(g.hintMax==null||g.hintMax<0) return "";
  const start = g.cfg.diff==="easy"?0.2:0.45;
  let n=0; if(t>=start) n=Math.min(g.hintMax, Math.floor((t-start)/(0.9-start)*g.hintMax)+1);
  const shown=new Set(g.revealOrder.slice(0,n));
  return [...g.answerLabel.toUpperCase()].map((c,i)=>c===" "?"  ":(shown.has(i)?c:"_")).join(" ");
}
function endGame(){
  const g=S.game;
  if(g&&GAMES[g.type]&&GAMES[g.type].noScore){ S.phase="menu"; S.game=null; SFX.fanfare(); confetti(4000); persist(); renderHost(true); broadcast(); return; }
  S.lastGained = g ? Object.entries(g.gained).sort((a,b)=>b[1]-a[1]).map(([id,p])=>({id,p})) : [];
  S.lastGame = g ? g.type : null;
  S.phase="gameover"; S.game=null; SFX.fanfare(); confetti(2500); persist(); renderHost(true); broadcast();
}

function handleAnswer(id, rid, v){
  const g=S.game; if(!g||g.rid!==rid) return;
  if(EXT[g.type]){ EXT[g.type].answer(g,id,v); if(S.game===g) updateHostLive(); broadcast(); return; }
  if(isGuess(g)){
    if(g.step!=="play"||g.res[id]) return;
    const guess=String(v||"").slice(0,40);
    g.tries[id]=(g.tries[id]||0)+1;
    const p=S.players[id];
    const right = g.cfg.mode==="pick" ? tight(guess)===tight(g.answerLabel) : matches(guess, g.item.a);
    if(right){
      const total=g.deadline-g.start, left=Math.max(0,g.deadline-Date.now());
      const first = Object.values(g.res).filter(r=>!r.wrong).length===0;
      const pts = addScore(id, Math.round(200 + 700*(left/total)) + (first?100:0));
      g.res[id]={pts}; SFX.ding();
      g.feed.push({c:"ok", t:`${p.emoji} ${p.name} got it!${first?" ⚡ FIRST":""}`});
    } else if(g.cfg.mode==="pick"){
      g.res[id]={pts:0,wrong:true}; SFX.buzz();
      g.feed.push({c:"", t:`${p.emoji} ${p.name} picked wrong 😬`});
    } else {
      const close=isClose(guess,g.item.a);
      g.feed.push({c:close?"close":"", t:`${p.emoji} ${guess}${close?"  (so close!)":""}`});
      if(close) send({k:"nudge", id, msg:`"${guess}" is so close!`, c:"close", rid:g.rid});
    }
    g.feed=g.feed.slice(-16);
    if(Object.keys(g.res).length>=activeIds().length) revealGuess();
    updateHostLive(); broadcast(); return;
  }
  if(g.type==="imposter"){
    if(g.step!=="vote"||!g.inRound.includes(id)||id===v||!g.inRound.includes(v)) return;
    g.votes[id]=v; SFX.tick();
    if(Object.keys(g.votes).length>=g.inRound.length) revealImposter();
    updateHostLive(); broadcast(); return;
  }
  if(g.type==="closest"){
    if(g.step!=="play") return; const n=Number(String(v).replace(/,/g,"")); if(!isFinite(n)) return;
    g.ans[id]=n; SFX.tick();
    if(Object.keys(g.ans).length>=activeIds().length) revealClosest();
    updateHostLive(); broadcast(); return;
  }
  if(g.type==="fakefact"){
    if(g.step==="write"){
      const t=String(v||"").trim().slice(0,40); if(!t) return;
      const truths=[g.item.t].concat(g.item.alt||[]);
      if(truths.some(x=>tight(x)===tight(t)||lev(tight(x),tight(t))<=1||(tight(x).length>3&&tight(t).includes(tight(x))))){
        send({k:"nudge", id, msg:"Too close to the truth! Write a different fake.", c:"bad", rid:g.rid}); return;
      }
      g.lies[id]=t; SFX.tick();
      if(Object.keys(g.lies).length>=activeIds().length) startFakeVote();
      updateHostLive(); broadcast(); return;
    }
    if(g.step==="vote"){
      const o=g.opts.find(o=>o.id===v); if(!o||o.authors.includes(id)) return;
      g.votes[id]=v; SFX.tick();
      if(activeIds().every(pid=>g.votes[pid] || !g.opts.some(o=>!o.authors.includes(pid)))) revealFake();
      updateHostLive(); broadcast(); return;
    }
  }
}

function revealGuess(){ const g=S.game; if(g.step!=="play")return; g.step="reveal"; g.deadline=null; SFX.reveal(); renderHost(true); broadcast(); }
function startImposterVote(){ const g=S.game; if(g.step!=="clues")return; g.step="vote"; g.start=Date.now(); g.deadline=Date.now()+60000; SFX.start(); renderHost(true); broadcast(); }
function revealImposter(){
  const g=S.game; if(g.step!=="vote")return; g.step="reveal"; g.deadline=null;
  const tally={}; Object.values(g.votes).forEach(v=>tally[v]=(tally[v]||0)+1); g.tally=tally;
  const max=Math.max(0,...Object.values(tally)); const tops=Object.keys(tally).filter(k=>tally[k]===max);
  g.caught = max>0 && tops.length===1 && tops[0]===g.imp;
  if(g.caught){ Object.entries(g.votes).forEach(([v,t])=>{ if(t===g.imp) addScore(v,500); }); }
  else addScore(g.imp,1000);
  g.caught?SFX.fanfare():SFX.buzz(); if(g.caught)confetti(1800);
  renderHost(true); broadcast();
}
function revealClosest(){
  const g=S.game; if(g.step!=="play")return; g.step="reveal"; g.deadline=null;
  const a=g.item.a; const rows=Object.entries(g.ans).map(([id,v])=>({id,v,d:Math.abs(v-a)})).sort((x,y)=>x.d-y.d);
  const table=[1000,700,500,300,150]; g.pts={}; let rank=0;
  rows.forEach((r,i)=>{ if(i>0&&r.d>rows[i-1].d) rank=i; let p=table[rank]??50; if(r.d===0)p+=500; g.pts[r.id]=addScore(r.id,p); });
  g.rows=rows; SFX.reveal(); renderHost(true); broadcast();
}
function startFakeVote(){
  const g=S.game; if(g.step!=="write")return;
  const map={};
  Object.entries(g.lies).forEach(([id,t])=>{ const k=tight(t); if(!map[k]) map[k]={id:uid(),text:t,authors:[]}; map[k].authors.push(id); });
  let opts=Object.values(map);
  const decoys=(g.item.d||[]).slice();
  while(opts.length<3&&decoys.length){ const d=decoys.shift(); if(!map[tight(d)]) opts.push({id:uid(),text:d,authors:[],house:true}); }
  opts.push({id:uid(),text:g.item.t,authors:[],truth:true});
  g.opts=shuffle(opts); g.votes={}; g.step="vote"; g.start=Date.now(); g.deadline=Date.now()+Math.max(25000,Math.round(g.cfg.time*500));
  SFX.start(); renderHost(true); broadcast();
}
function revealFake(){
  const g=S.game; if(g.step!=="vote")return; g.step="reveal"; g.deadline=null; g.pts={};
  const add=(id,p)=>{g.pts[id]=(g.pts[id]||0)+addScore(id,p);};
  Object.entries(g.votes).forEach(([voter,oid])=>{ const o=g.opts.find(o=>o.id===oid); if(!o)return; if(o.truth) add(voter,1000); else o.authors.forEach(a=>add(a,500)); });
  SFX.reveal(); renderHost(true); broadcast();
}

let lastTickSec=null, lastCd=null;
function hostTick(){
  const g=S&&S.game; if(!g){ return; }
  const now=Date.now();
  if(g.step==="ready"){
    const s=Math.ceil((g.readyEnd-now)/1000);
    if(s!==lastCd){ lastCd=s; const el=$("#cd"); if(el&&s>0){ el.textContent=s; el.style.animation="none"; void el.offsetWidth; el.style.animation=""; } if(s>0)SFX.beep(); }
    if(now>=g.readyEnd){ g.step=g.after; g.start=now; g.deadline=g.dur?now+g.dur:null; if(EXT[g.type]&&EXT[g.type].enter) EXT[g.type].enter(g); SFX.go(); renderHost(true); broadcast(); }
    return;
  }
  if(EXT[g.type]&&EXT[g.type].tick){ EXT[g.type].tick(g,now); if(S.game!==g) return; }
  if(isGuess(g)&&g.step==="play"){
    const h=hintText(g,(now-g.start)/(g.deadline-g.start));
    if(h!==g.hint){ g.hint=h; const el=$("#hint"); if(el) el.innerHTML=hintHtml(g); SFX.pop(); broadcast(); }
  }
  if(!g.deadline){ return; }
  const left=g.deadline-now, sec=Math.ceil(left/1000);
  lastTickSec=sec;
  if(left>0) clockBed(left);
  if(left<=0&&EXT[g.type]){ g.deadline=null; if(EXT[g.type].timeout) EXT[g.type].timeout(g); }
  else if(left<=0){
    if(isGuess(g)&&g.step==="play") revealGuess();
    else if(g.type==="imposter"&&g.step==="clues") startImposterVote();
    else if(g.type==="imposter"&&g.step==="vote") revealImposter();
    else if(g.type==="closest"&&g.step==="play") revealClosest();
    else if(g.type==="fakefact"&&g.step==="write") startFakeVote();
    else if(g.type==="fakefact"&&g.step==="vote") revealFake();
  }
  updateTimers();
}
function updateTimers(){
  const el=$("#timer"); const g=S&&S.game;
  if(el&&g&&g.deadline){ const s=Math.max(0,Math.ceil((g.deadline-Date.now())/1000)); el.textContent="⏱ "+s; el.classList.toggle("low",s<=5); }
}

/* -------- host rendering -------- */
function isDone(g,id){
  if(!g)return false;
  if(EXT[g.type]) return EXT[g.type].done?!!EXT[g.type].done(g,id):false;
  if(isGuess(g)) return !!g.res[id];
  if(g.type==="imposter") return g.step==="vote"&&!!g.votes[id];
  if(g.type==="closest") return g.step==="play"&&g.ans[id]!=null;
  if(g.type==="fakefact") return (g.step==="write"&&!!g.lies[id])||(g.step==="vote"&&!!g.votes[id]);
  return false;
}
function sideBoard(){
  const ps=playersArr().sort((a,b)=>(b.score||0)-(a.score||0));

function animateSketch(g){
  const svg=$("#sk"); if(!svg) return;
  svg.innerHTML=g.order.map(d=>`<path d="${d}"/>`).join("");
  const paths=[...svg.querySelectorAll("path")]; const lens=paths.map(p=>p.getTotalLength()||1); const total=lens.reduce((a,b)=>a+b,0);
  paths.forEach((p,i)=>{p.style.strokeDasharray=lens[i];p.style.strokeDashoffset=lens[i];});
  const DRAW = (g.deadline-g.start)*({easy:0.35,medium:0.45,hard:0.55}[g.cfg.diff]||0.45);
  const frame=()=>{
    const done = g.step!=="play" ? 1 : Math.min(1,(Date.now()-g.start)/DRAW);
    let drawn=total*done;
    paths.forEach((p,i)=>{ const show=Math.max(0,Math.min(lens[i],drawn)); p.style.strokeDashoffset=lens[i]-show; drawn-=lens[i]; });
    if(done<1&&S.game===g) animRAF=requestAnimationFrame(frame);
  }; frame();
}
const imgCache={};
function loadFoodImg(item){
  const key=item.url||item.c;
  if(imgCache[key]) return imgCache[key];
  const p=new Promise(res=>{ const im=new Image(); im.crossOrigin="anonymous"; im.onload=()=>res(im); im.onerror=()=>res(null); im.src=item.url||(TW+item.c+".svg"); setTimeout(()=>res(null),6000); });
  imgCache[key]=p; return p;
}
function animatePixel(g){
  const cv=$("#px"); if(!cv) return; const ctx=cv.getContext("2d"); if(!ctx) return;
  const W=600;
  const base=document.createElement("canvas"); base.width=W; base.height=W; const bctx=base.getContext("2d");
  const small=document.createElement("canvas"); const sctx=small.getContext("2d");
  const LV={easy:[10,12,16,20,26,34,44,60,80,120,W],medium:[5,6,7,8,10,12,15,18,22,28,36,48,64,96,W],hard:[3,4,5,6,7,8,9,10,12,14,16,19,22,26,32,40,52,72,W]}[g.cfg.diff];
  const SPAN={easy:0.55,medium:0.8,hard:0.9}[g.cfg.diff];
  const hard=g.cfg.diff==="hard";
  loadFoodImg(g.item).then(im=>{
    if(S.game!==g) return;
    bctx.fillStyle="#ffffff"; bctx.fillRect(0,0,W,W);
    if(im){
      if(g.item.url&&im.width&&im.height){ const r2=Math.max(W/im.width,W/im.height); bctx.drawImage(im,(W-im.width*r2)/2,(W-im.height*r2)/2,im.width*r2,im.height*r2); }
      else bctx.drawImage(im,W*0.08,W*0.08,W*0.84,W*0.84);
    } else { bctx.font=`${Math.round(W*0.5)}px serif`; bctx.textAlign="center"; bctx.textBaseline="middle"; bctx.fillStyle="#1a1033"; bctx.fillText("?",W/2,W/2); }
    const frame=()=>{
      const t = g.step!=="play"?1:Math.min(1,(Date.now()-g.start)/((g.deadline-g.start)*SPAN));
      const n=LV[Math.min(LV.length-1,Math.floor(t*(LV.length-1)))];
      const z = hard ? 1+2.2*Math.max(0,1-t*1.25) : 1;
      const sw=W/z; const sx=Math.max(0,Math.min(W-sw,g.zoomC[0]*W/480-sw/2)); const sy=Math.max(0,Math.min(W-sw,g.zoomC[1]*W/480-sw/2));
      const gray = hard && t<0.7;
      if(n>=W){ ctx.imageSmoothingEnabled=true; ctx.filter=gray?"grayscale(1)":"none"; ctx.drawImage(base,sx,sy,sw,sw,0,0,W,W); ctx.filter="none"; }
      else { small.width=n; small.height=n; sctx.imageSmoothingEnabled=true; sctx.filter=gray?"grayscale(1)":"none"; sctx.drawImage(base,sx,sy,sw,sw,0,0,n,n);
        ctx.imageSmoothingEnabled=false; ctx.clearRect(0,0,W,W); ctx.drawImage(small,0,0,n,n,0,0,W,W); }
      if(t<1&&S.game===g) animRAF=requestAnimationFrame(frame);
    }; frame();
  });
}

let P = null, ST = null, pView = "";
let pLeftAt = 0, pLeftVal = null;
let nudge = null;
let impShow = false;

function startPlayer(room){
  const me=lsGet("bday-me",{});
  P={id:me.id||uid(), name:me.name||"", emoji:me.emoji||pick(EMOJIS), room};
  lsSet("bday-me",{id:P.id,name:P.name,emoji:P.emoji,room:me.room});
  if(!P.name||me.room!==room) renderJoin(); else joinRoom();
}
function renderJoin(){
  $("#app").innerHTML=`<div class="phone"><div class="phone-body" style="justify-content:flex-start;padding-top:30px">
    <div class="center"><div class="big-emoji" style="font-size:70px" id="my-emo">${P.emoji}</div><h2>Join the party!</h2><div class="muted">Room ${esc(P.room)}</div></div>
    <input id="nm" maxlength="16" placeholder="Your name" value="${esc(P.name)}" autocomplete="off">
    <div class="muted">Pick your avatar</div>
    <div class="emoji-pick">${EMOJIS.map(e=>`<button class="${e===P.emoji?"sel":""}" onclick="pickEmo(this,'${e}')">${e}</button>`).join("")}</div>
    <button class="pink" onclick="doJoin()">Join 🎉</button></div></div>`;
  $("#nm").addEventListener("keydown",e=>{if(e.key==="Enter")doJoin();});
}
function pickEmo(b,e){ P.emoji=e; document.querySelectorAll(".emoji-pick button").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); $("#my-emo").textContent=e; }
function doJoin(){ const n=$("#nm").value.trim(); if(!n){ $("#nm").classList.add("shake"); setTimeout(()=>$("#nm").classList.remove("shake"),400); return; }
  P.name=n.slice(0,16); lsSet("bday-me",{id:P.id,name:P.name,emoji:P.emoji,room:P.room}); joinRoom(); }
function joinRoom(){
  pView=""; renderPlayerShell(`<div class="status">Connecting...</div>`);
  if(!channel) connect(P.room, playerOnMsg, ()=>sendJoin()); else sendJoin();
  setInterval(()=>{ if(connected){ if(!ST) sendJoin(); else send({k:"ping",id:P.id}); } },4000);
  setInterval(playerTimer,500);
}
function sendJoin(){ send({k:"join",id:P.id,name:P.name,emoji:P.emoji}); }
function playerOnMsg(m){
  if(m.k==="kicked"&&m.id===P.id){ $("#app").innerHTML=`<div class="phone"><div class="phone-body center"><h2>You were removed by the host</h2></div></div>`; channel&&channel.unsubscribe(); return; }
  if(m.k==="nudge"&&m.id===P.id){ nudge={msg:m.msg,c:m.c,rid:m.rid}; const el=$("#nudge"); if(el){ el.className="status "+(m.c||""); el.textContent=m.msg; el.style.display=""; } else { pView=""; renderPlayer(); } if(navigator.vibrate)navigator.vibrate(120); return; }
  if(pextMsg(m)) return;
  if(m.k!=="state") return;
  if(ST?.g?.rid!==m.st?.g?.rid) impShow=false;
  ST=m.st;
  if(!ST.players.some(p=>p.id===P.id)) sendJoin();
  if(ST.g&&ST.g.left!=null){ pLeftAt=Date.now(); pLeftVal=ST.g.left; } else pLeftVal=null;
  if(nudge&&(!ST.g||ST.g.rid!==nudge.rid)) nudge=null;
  renderPlayer();
}
function myScore(){ return ST?.players.find(p=>p.id===P.id)?.score||0; }
function renderPlayerShell(body){
  $("#app").innerHTML=`<div class="phone"><div class="phone-top"><div class="me">${esc(P.emoji)} ${esc(P.name)}</div><div class="row" style="gap:8px"><span id="ptimer" class="timer" style="font-size:20px;display:none"></span><span class="score" id="pscore">${fmtNum(myScore())} pts</span></div></div><div class="phone-body" id="pbody">${body}</div>
  <div class="reacts">${REACTS.map(e=>`<button onclick="react('${e}')">${e}</button>`).join("")}</div></div>`;
}
function react(e){ send({k:"react",id:P.id,e}); if(navigator.vibrate)navigator.vibrate(20); }
function playerTimer(){ const el=$("#ptimer"); if(!el)return; if(pLeftVal==null){el.style.display="none";return;} const s=Math.max(0,pLeftVal-Math.floor((Date.now()-pLeftAt)/1000)); el.style.display=""; el.textContent="⏱ "+s; el.classList.toggle("low",s<=5); }
function myPriv(){ return ST?.g?.priv?.[P.id]||{}; }
function playerKey(){
  if(!ST) return "none"; const g=ST.g, pv=myPriv();
  return [ST.phase,g?.type,g?.rid,g?.step,JSON.stringify(pv),g?.opts?.length,g?.q,(g?.choices||[]).join(),impShow,(g&&EXT[g.type]&&EXT[g.type].pkey)?EXT[g.type].pkey(g,pv):""].join("|");
}
function renderPlayer(){
  const sc=$("#pscore"); if(sc) sc.textContent=fmtNum(myScore())+" pts";
  const ph=$("#phint"); if(ph&&ST?.g) ph.textContent=ST.g.hint||"";
  const key=playerKey();
  if(key===pView&&$("#pbody")) { playerTimer(); extP("pupd"); return; }
  const prev=$("#ans"); const prevVal=prev?prev.value:""; const prevRid=prev?.dataset.rid; const focused=prev&&document.activeElement===prev;
  pView=key; renderPlayerShell(playerBody());
  const ni=$("#ans");
  if(ni&&prevRid===ni.dataset.rid){ if(prevVal&&!ni.value) ni.value=prevVal; if(focused) ni.focus(); }
  if(ni) ni.addEventListener("keydown",e=>{if(e.key==="Enter")submitAns(ST?.g&&(isGuess(ST.g)||ST.g.type==="drawit"));});
  playerTimer(); extP("pafter"); extP("pupd");
}
function rankLine(){ if(!ST)return""; const ps=ST.players.slice().sort((a,b)=>b.score-a.score); const r=ps.findIndex(p=>p.id===P.id)+1; return r?`You're #${r} of ${ps.length}`:""; }
function nudgeHtml(){ return `<div id="nudge" class="status ${nudge?.c||""}" style="${nudge?"":"display:none"}">${esc(nudge?.msg||"")}</div>`; }
function playerBody(){
  if(!ST) return `<div class="status">Waiting for the host... make sure the laptop has the game open.</div>`;
  if(!ST.g){
    if(ST.phase==="final"){ const ps=ST.players.slice().sort((a,b)=>b.score-a.score); const won=ps[0]?.id===P.id;
      return `<div class="center"><div class="big-emoji">${won?"👑":"🎉"}</div><h2>${won?"YOU ARE THE CHAMPION!":esc(ps[0]?.name)+" wins!"}</h2><div class="muted" style="margin-top:8px">${rankLine()}</div></div>`; }
    if(ST.phase==="gameover"){ const mine=(ST.gained||[]).find(r=>r.id===P.id); return `<div class="center"><div class="big-emoji">🏁</div><h2>Game over!</h2><div class="status ${mine?"ok":""}" style="margin-top:12px">${mine?`You earned +${fmtNum(mine.p)} this game`:"No points this game"}</div><div class="muted" style="margin-top:10px">${rankLine()}</div></div>`; }
    return `<div class="center"><div class="big-emoji">${esc(P.emoji)}</div><h2>You're in!</h2><div class="muted" style="margin-top:8px">${ST.phase==="lobby"?"Waiting for everyone to join. Look at the big screen.":"The host is picking the next game..."}</div><div class="muted" style="margin-top:8px">${rankLine()}</div></div>`;
  }
  const g=ST.g, pv=myPriv();
  const head=`<div class="center"><span class="pill">${GAMES[g.type].ic} ${GAMES[g.type].name} · ${g.idx}/${g.total}</span>${g.mult>1?` <span class="pill x2">⚡ x2</span>`:""}</div>`;
  if(g.step==="ready") return `${head}<div class="center"><div class="big-emoji">👀</div><h2>Get ready!</h2><div class="muted" style="margin-top:8px">Eyes on the big screen</div></div>`;
  if(EXT[g.type]) return head+EXT[g.type].phone(g,pv);
  if(g.type==="sketch"||g.type==="pixel"){
    const ask=g.type==="sketch"?"What's being drawn?":"What's this dish?";
    if(g.step==="play"){
      if(pv.ok) return `${head}<div class="status ok">🎉 You got it! +${pv.pts}</div><div class="muted center">Shhh, don't tell the others!</div>`;
      if(pv.wrong) return `${head}<div class="status bad">😬 Wrong pick! Wait for the next one.</div>`;
      if(g.mode==="pick") return `${head}<h2 class="center">${ask}</h2><div class="muted center">One try only. Choose wisely!</div><div class="pick4">${(g.choices||[]).map(c=>`<button onclick="pickAns(this)" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
      return `${head}<h2 class="center">${ask}</h2><div class="hint" id="phint">${esc(g.hint||"")}</div>${nudgeHtml()}
      <input id="ans" data-rid="${g.rid}" placeholder="Type your guess" autocomplete="off" autocapitalize="off"><button class="pink" onclick="submitAns(true)">Guess!</button>${pv.tries?`<div class="muted center">${pv.tries} guess${pv.tries>1?"es":""} so far. Keep going!</div>`:""}`;
    }
    return `${head}<div class="center"><div class="muted">It was</div><h2 style="font-size:40px;color:var(--yellow)">${esc(g.answer)}</h2></div>${pv.ok?`<div class="status ok">+${pv.pts} points</div>`:`<div class="status">No points this time</div>`}<div class="muted center">${rankLine()}</div>`;
  }
  if(g.type==="imposter"){
    if(pv.late) return `${head}<div class="status">You joined mid-round. You'll be in the next one!</div>`;
    const secret = pv.imp ? `<div class="secret imp"><div style="font-weight:700">YOU ARE THE</div><div class="w">🕵️ IMPOSTER</div><div style="margin-top:8px">${pv.cat?`Category: <b>${esc(pv.cat)}</b><br>`:"No clue for you this time 😈<br>"}Blend in. Don't get caught!</div></div>`
      : `<div class="secret"><div style="font-weight:700">Secret word</div><div class="w">${esc(pv.word)}</div><div style="margin-top:8px">Category: ${esc(pv.cat)}</div></div>`;
    if(g.step==="clues"){
      const starter=g.cands.find(c=>c.id===g.first);
      return `${head}<div onclick="impShow=!impShow;renderPlayer()" style="cursor:pointer">${impShow?secret:`<div class="status" style="padding:44px 18px">👆 Tap to see your secret<br><span class="muted" style="font-size:15px">Hide your screen from others!</span></div>`}</div><div class="muted center">${impShow?"Tap again to hide. ":""}Say ONE word clue on your turn.${starter?`<br>${esc(starter.emoji)} ${esc(starter.name)} starts.`:""}</div>`;
    }
    if(g.step==="vote"){
      return `${head}<h2 class="center">Who's the Imposter?</h2><div class="vote-btns">${g.cands.filter(c=>c.id!==P.id).map(c=>`<button class="${pv.voted===c.id?"sel":""}" onclick="vote('${c.id}',this)">${esc(c.emoji)} ${esc(c.name)}</button>`).join("")}</div>${pv.voted?`<div class="muted center">Vote locked in. You can change it until the reveal.</div>`:""}`;
    }
    const me=g.imp===P.id; const won = me ? !g.caught : g.caught && pv.voted===g.imp;
    return `${head}<div class="center"><div class="big-emoji">${won?"🎉":"😬"}</div><h2>${me?(g.caught?"You got caught!":"You fooled them all!"):(g.caught?(pv.voted===g.imp?"You caught them!":"They got caught, but not by you"):"The Imposter got away!")}</h2><div class="muted" style="margin-top:8px">The word was <b>${esc(g.word)}</b></div></div>`;
  }
  if(g.type==="closest"){
    if(g.step==="play"){
      return `${head}<h2 class="center" style="font-size:26px">${esc(g.q)}</h2><input id="ans" data-rid="${g.rid}" type="number" inputmode="decimal" placeholder="Your guess (${esc(g.u)})"><button class="pink" onclick="submitAns()">${pv.v!=null?"Update guess":"Lock it in"}</button>${pv.v!=null?`<div class="status ok">Your guess: ${fmtNum(pv.v)} ${esc(g.u)}</div>`:""}`;
    }
    return `${head}<div class="center"><div class="muted">The answer</div><h2 style="font-size:44px;color:var(--yellow)">${fmtNum(g.answer)} ${esc(g.u)}</h2></div>${pv.v!=null?`<div class="status ${pv.pts>=700?"ok":""}">You said ${fmtNum(pv.v)}. +${pv.pts||0} points</div>`:`<div class="status">You didn't answer</div>`}<div class="muted center">${rankLine()}</div>`;
  }
  if(g.type==="fakefact"){
    if(g.step==="write"){
      if(pv.wrote) return `${head}<div class="status ok">Fake submitted ✍️ Waiting for others...</div>`;
      return `${head}<h2 class="center" style="font-size:24px">${esc(g.q)}</h2><div class="muted center">Write a believable FAKE answer to fill the blank</div>${nudgeHtml()}<input id="ans" data-rid="${g.rid}" maxlength="40" placeholder="Your fake answer" autocomplete="off"><button class="pink" onclick="submitAns()">Submit fake</button>`;
    }
    if(g.step==="vote"){
      const opts=g.opts.filter(o=>!o.own.includes(P.id));
      return `${head}<h2 class="center" style="font-size:22px">${esc(g.q)}</h2><div class="muted center">Pick the TRUTH</div><div class="vote-btns">${opts.map(o=>`<button class="${pv.voted===o.id?"sel":""}" onclick="vote('${o.id}',this)">${esc(o.text)}</button>`).join("")}</div>`;
    }
    const right = pv.voted===g.truthId;
    return `${head}<div class="center"><div class="muted">The truth</div><h2 style="font-size:36px;color:var(--yellow)">${esc(g.opts.find(o=>o.id===g.truthId)?.text)}</h2></div><div class="status ${pv.pts?"ok":""}">${right?"You found the truth! ":""}+${pv.pts||0} points this round</div><div class="muted center">${rankLine()}</div>`;
  }
  return "";
}
function submitAns(keep){
  const i=$("#ans"); if(!i)return; const v=i.value.trim(); if(!v){ i.classList.add("shake"); setTimeout(()=>i.classList.remove("shake"),400); return; }
  nudge=null; const n=$("#nudge"); if(n) n.style.display="none";
  send({k:"ans",id:P.id,rid:ST.g.rid,v});
  if(keep){ i.value=""; i.focus(); } else i.blur();
}

/* ---------- sounds ---------- */
function noise(dur=.3,vol=.2,delay=0,hp=1000){ if(MUTED)return; const ac=audio(); if(!ac)return; const b=ac.createBuffer(1,Math.max(1,Math.floor(ac.sampleRate*dur)),ac.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); const s=ac.createBufferSource(); s.buffer=b; const f=ac.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp; const g=ac.createGain(); g.gain.value=vol; s.connect(f).connect(g).connect(ac.destination); s.start(ac.currentTime+delay); }
function slide(f1,f2,dur,type="sine",vol=.2,delay=0){ if(MUTED)return; const ac=audio(); if(!ac)return; const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay; o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.05); }

 start:()=>{noise(.35,.1,0,1800);slide(260,780,.22,"triangle",.2,.12);tone(1046,.15,"triangle",.14,.36);},
 reveal:()=>{for(let i=0;i<14;i++)noise(.05,.11,i*.055,300);noise(1.1,.14,.8,5000);[523,659,784].forEach(f=>tone(f,.5,"triangle",.14,.8));},
 go:()=>{tone(466,.45,"square",.1);tone(587,.45,"square",.08);tone(698,.45,"square",.07);},

 siren:()=>{for(let i=0;i<3;i++){slide(600,1100,.33,"square",.07,i*.66);slide(1100,600,.33,"square",.07,i*.66+.33);}},

let lastHs=null;
function clockBed(left){
  const hs=Math.ceil(left/500); if(hs===lastHs) return; lastHs=hs;
  const sec=Math.ceil(left/1000);
  if(hs%2===0){ (sec%2?SFX.tickA:SFX.tickB)(); if(sec<=10) SFX.bass(); }
  else if(sec<=10) SFX.tickFast();
}

function setReady(g,after,dur){ g.step="ready"; g.readyEnd=Date.now()+3200; g.deadline=null; g.after=after; g.dur=dur; lastCd=null; }
function setStep(g,step,dur){ g.step=step; g.start=Date.now(); g.deadline=dur?Date.now()+dur:null; }
function pname(id){ const p=S.players[id]; return p?`${esc(p.emoji)} ${esc(p.name)}`:"?"; }
function extP(name){ const g=ST&&ST.g; if(g&&EXT[g.type]&&EXT[g.type][name]) EXT[g.type][name](g); }
function sendAns(v){ if(ST&&ST.g) send({k:"ans",id:P.id,rid:ST.g.rid,v}); }
function redrawStrokes(ctx,strokes,W){
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,W,W); ctx.lineCap="round"; ctx.lineJoin="round"; const k=W/1000;
  (strokes||[]).forEach(s=>{ const p=s.p; if(!p||!p.length) return; ctx.strokeStyle=s.c; ctx.fillStyle=s.c; ctx.lineWidth=s.w*k;
    if(p.length===1){ ctx.beginPath(); ctx.arc(p[0][0]*k,p[0][1]*k,s.w*k/2,0,7); ctx.fill(); return; }
    ctx.beginPath(); ctx.moveTo(p[0][0]*k,p[0][1]*k); for(let i=1;i<p.length;i++) ctx.lineTo(p[i][0]*k,p[i][1]*k); ctx.stroke(); });
}
function drawInto(id,strokes){ const cv=document.getElementById(id); if(!cv) return; const ctx=cv.getContext("2d"); if(ctx) redrawStrokes(ctx,strokes,cv.width); }
const okColor=c=>/^#[0-9a-f]{6}$/i.test(c||"")?c:"#1a1033";
const clampPt=q=>[Math.max(0,Math.min(1000,q[0]|0)),Math.max(0,Math.min(1000,q[1]|0))];
function cleanStrokes(s){ if(!Array.isArray(s)) return []; return s.slice(0,400).map(x=>({c:okColor(x&&x.c),w:Math.max(2,Math.min(40,Number(x&&x.w)||8)),p:(Array.isArray(x&&x.p)?x.p:[]).slice(0,3000).filter(q=>Array.isArray(q)&&q.length===2).map(clampPt)})).filter(x=>x.p.length); }
function applyOps(st,ops){ (Array.isArray(ops)?ops:[]).slice(0,300).forEach(o=>{ if(!o) return;
  const pts=(Array.isArray(o.p)?o.p:[]).slice(0,800).filter(q=>Array.isArray(q)&&q.length===2).map(clampPt);
  if(o.t==="s") st.push({c:okColor(o.c),w:Math.max(2,Math.min(40,+o.w||8)),p:pts});
  else if(o.t==="p"){ const l=st[st.length-1]; if(l) l.p.push(...pts); }
  else if(o.t==="undo") st.pop();
  else if(o.t==="clear") st.length=0; }); }
function nextPenQ(){ S.usedQ=S.usedQ||[]; let avail=PENALTY.map((_,i)=>i).filter(i=>!S.usedQ.includes(i)); if(!avail.length){ S.usedQ=[]; avail=PENALTY.map((_,i)=>i); } const i=pick(avail); S.usedQ.push(i); persist(); return PENALTY[i]; }

let PAD=null;
const PCOLORS=["#1a1033","#ff3b5c","#2b8cff","#18b36b","#ff8a3d","#a259ff","#8b5a2b","#ffffff"];
function ensurePad(key,stream){ if(!PAD||PAD.key!==key) PAD={key,strokes:[],color:"#1a1033",w:8,stream,buf:[]}; PAD.stream=stream; }
function padHtml(){ return `<div class="padwrap"><canvas id="pad" width="1000" height="1000"></canvas></div><div class="padtools">${PCOLORS.map(c=>`<button class="sw ${PAD.color===c?"on":""}" data-c="${c}" style="background:${c}" onclick="padColor('${c}')">${c==="#ffffff"?"🧽":""}</button>`).join("")}<button class="small ghost" id="psz" onclick="padSize()">${PAD.w>12?"⬤ Thick":"• Thin"}</button><button class="small ghost" onclick="padUndo()">↶ Undo</button><button class="small ghost" onclick="padClear()">🗑</button></div>`; }
function padColor(c){ PAD.color=c; document.querySelectorAll(".sw").forEach(b=>b.classList.toggle("on",b.dataset.c===c)); }
function padSize(){ PAD.w=PAD.w>12?8:24; const b=$("#psz"); if(b) b.textContent=PAD.w>12?"⬤ Thick":"• Thin"; }
function padUndo(){ PAD.strokes.pop(); drawInto("pad",PAD.strokes); padOp({t:"undo"}); }
function padClear(){ PAD.strokes=[]; drawInto("pad",PAD.strokes); padOp({t:"clear"}); }
function padOp(o){ if(!PAD||!PAD.stream) return; const l=PAD.buf[PAD.buf.length-1]; if(o.t==="p"&&l&&(l.t==="p"||l.t==="s")) l.p.push(...o.p); else PAD.buf.push(JSON.parse(JSON.stringify(o))); }
function padFlush(){ if(PAD&&PAD.stream&&PAD.buf.length&&P&&ST&&ST.g){ send({k:"draw",id:P.id,rid:ST.g.rid,ops:PAD.buf}); PAD.buf=[]; } }
setInterval(padFlush,110);
function bindPad(){
  const cv=$("#pad"); if(!cv||!PAD) return; const ctx=cv.getContext("2d"); if(!ctx) return;
  redrawStrokes(ctx,PAD.strokes,1000); let on=false;
  const pt=e=>{ const r=cv.getBoundingClientRect(); return clampPt([Math.round((e.clientX-r.left)/r.width*1000),Math.round((e.clientY-r.top)/r.height*1000)]); };
  cv.addEventListener("pointerdown",e=>{ e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(_){} on=true; const p=pt(e); const s={c:PAD.color,w:PAD.w,p:[p]}; PAD.strokes.push(s); ctx.fillStyle=s.c; ctx.beginPath(); ctx.arc(p[0],p[1],s.w/2,0,7); ctx.fill(); padOp({t:"s",c:s.c,w:s.w,p:[p]}); });
  cv.addEventListener("pointermove",e=>{ if(!on) return; const p=pt(e); const s=PAD.strokes[PAD.strokes.length-1]; if(!s) return; const l=s.p[s.p.length-1]; if(Math.hypot(p[0]-l[0],p[1]-l[1])<6) return; s.p.push(p); ctx.strokeStyle=s.c; ctx.lineWidth=s.w; ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(l[0],l[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); padOp({t:"p",p:[p]}); });
  const up=()=>{ on=false; }; cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
}

EXT.drawit={
 tight:true,
 total:(cfg,n)=>Math.max(1,n*cfg.rounds),
 readyText:"Next artist coming up! 🎨",
 round(g,now,ids){
  if(!g.order) g.order=shuffle(ids);
  let d=g.order[(g.idx-1)%g.order.length]; if(!ids.includes(d)) d=pick(ids);
  g.drawer=d; g.strokes=[]; g.res={}; g.tries={}; g.feed=[]; g.word=null; g.hint=""; g.answerLabel="";
  g.usedW=g.usedW||[]; const all=DRAW_WORDS[g.cfg.diff]; const pool=all.filter(w=>!g.usedW.includes(w));
  g.opts=shuffle(pool.length>=3?pool:all).slice(0,3);
  setReady(g,"choose",15000);
 },
 choose(g,w){
  g.word=w; g.usedW.push(w); g.answerLabel=cap(w);
  const letters=[...g.answerLabel].map((c,i)=>c===" "?-1:i).filter(i=>i>=0);
  g.revealOrder=shuffle(letters);
  g.hintMax={easy:Math.ceil(letters.length*0.5),medium:Math.ceil(letters.length*0.25),hard:-1}[g.cfg.diff];
  setStep(g,"play",g.cfg.time*1000); g.hint=hintText(g,0); SFX.start(); renderHost(true); broadcast();
 },
 reveal(g){ if(g.step!=="play") return; g.step="reveal"; g.deadline=null; SFX.reveal(); renderHost(true); broadcast(); },
 answer(g,id,v){
  if(g.step==="choose"){ if(id===g.drawer&&g.opts.includes(v)) this.choose(g,v); return; }
  if(g.step!=="play"||id===g.drawer||g.res[id]) return;
  const guess=String(v||"").slice(0,40); g.tries[id]=(g.tries[id]||0)+1; const p=S.players[id];
  if(matches(guess,[g.word])){
    const total=g.deadline-g.start, left=Math.max(0,g.deadline-Date.now()); const first=!Object.keys(g.res).length;
    const pts=addScore(id,Math.round(200+700*left/total)+(first?100:0)); addScore(g.drawer,150);
    g.res[id]={pts}; SFX.ding(); g.feed.push({c:"ok",t:`${p.emoji} ${p.name} got it!${first?" ⚡ FIRST":""}`});
  } else {
    const close=isClose(guess,[g.word]); g.feed.push({c:close?"close":"",t:`${p.emoji} ${guess}${close?"  (so close!)":""}`});
    if(close) send({k:"nudge",id,msg:`"${guess}" is so close!`,c:"close",rid:g.rid});
  }
  g.feed=g.feed.slice(-16);
  if(activeIds().filter(x=>x!==g.drawer).every(x=>g.res[x])) this.reveal(g);
 },
 tick(g,now){
  if(g.step==="play"){ const h=hintText(g,(now-g.start)/(g.deadline-g.start)); if(h!==g.hint){ g.hint=h; const el=$("#hint"); if(el) el.innerHTML=hintHtml(g); SFX.pop(); broadcast(); } }
 },
 timeout(g){ if(g.step==="choose") this.choose(g,g.opts[0]); else if(g.step==="play"){ g.step="play"; this.reveal(g); } },
 msg(g,m){ if(m.k==="draw"&&m.id===g.drawer&&m.rid===g.rid&&g.step==="play"){ applyOps(g.strokes,m.ops); drawInto("dc",g.strokes); } },
 pub(g,o,ids){
  o.drawer=g.drawer; o.hint=g.step==="play"?g.hint:""; o.nright=Object.keys(g.res).length;
  if(g.step==="reveal") o.answer=g.answerLabel;
  ids.forEach(id=>{ o.priv[id]= id===g.drawer ? {drawer:true,opts:g.step==="choose"?g.opts:null,word:g.word} : (g.res[id]?{ok:true,pts:g.res[id].pts}:{tries:g.tries[id]||0}); });
 },

 host(g){

EXT.telephone={
 total:cfg=>cfg.rounds,
 readyText:"Write something funny! ✍️",
 kind:(g,k)=>k===0?"text0":(k%2===1?"draw":"guess"),
 round(g,now,ids){
  g.order=shuffle(ids); g.steps=Math.min(g.order.length,8);
  g.chains=g.order.map(id=>({owner:id,entries:[]})); g.k=0; g.sub={}; g.show=null; g.collecting=false;
  setReady(g,"work",45000);
 },
 enter(g){ if(g.step==="work"){ g.sub={}; this.sendTasks(g); } },
 taskFor(g,id){
  const n=g.order.length, i=g.order.indexOf(id); if(i<0) return null;
  const c=((i-g.k)%n+n)%n, kind=this.kind(g,g.k), prev=g.chains[c].entries[g.k-1];
  const t={kk:g.k,kind,c}; if(kind==="draw") t.text=prev?prev.v:""; if(kind==="guess") t.strokes=prev?prev.v:[]; return t;
 },
 sendTasks(g){ const rid=g.rid, k=g.k; g.order.forEach((id,i)=>setTimeout(()=>{ if(S.game===g&&g.rid===rid&&g.k===k&&g.step==="work") send({k:"task",id,rid,t:this.taskFor(g,id)}); },i*80)); },
 msg(g,m){ if(m.k==="needtask"&&g.step==="work"&&g.order.includes(m.id)) send({k:"task",id:m.id,rid:g.rid,t:this.taskFor(g,m.id)}); },
 answer(g,id,v){
  if(g.step!=="work"||!v||v.kk!==g.k||g.sub[id]!==undefined||!g.order.includes(id)) return;
  if(this.kind(g,g.k)==="draw"){ g.sub[id]=cleanStrokes(v.strokes); if(g.sub[id].length) addScore(id,100); }
  else { const t=String(v.text||"").trim().slice(0,80); g.sub[id]=t||"🤷 (blank)"; if(t) addScore(id,100); }
  SFX.tick();
  const act=activeIds(); if(g.order.filter(x=>act.includes(x)).every(x=>g.sub[x]!==undefined)) this.advance(g);
 },
 advance(g){
  if(g.step!=="work") return; const kind=this.kind(g,g.k), n=g.order.length;
  g.order.forEach((id,i)=>{ const c=((i-g.k)%n+n)%n; let v=g.sub[id]; if(v===undefined) v=kind==="draw"?[]:"🤷 (ran out of time)"; g.chains[c].entries.push({kind:kind==="draw"?"draw":"text",by:id,v}); });
  g.k++; g.collecting=false; g.sub={};
  if(g.k>=g.steps){ g.step="show"; g.deadline=null; g.show={c:0,i:0,done:false}; SFX.reveal(); }
  else { const nk=this.kind(g,g.k); setStep(g,"work",(nk==="draw"?g.cfg.time:40)*1000); this.sendTasks(g); SFX.start(); }
  renderHost(true); broadcast();
 },
 timeout(g){ if(g.step!=="work") return; if(!g.collecting){ g.collecting=true; send({k:"collect",rid:g.rid,kk:g.k}); g.deadline=Date.now()+2500; } else this.advance(g); },

let TTL_LIE=null;
EXT.ttl={
 total:(cfg,n)=>Math.max(1,Math.min(cfg.rounds,n)),
 readyText:"Think of 2 truths and 1 sneaky lie 🤞",

  if(g.step==="write"){ if(!v||!Array.isArray(v.s)||v.s.length!==3) return; const s=v.s.map(x=>String(x||"").trim().slice(0,90)); if(s.some(x=>!x)) return; const lie=Number(v.lie); if(![0,1,2].includes(lie)) return;
   g.subs[id]={s,lie}; SFX.tick(); if(activeIds().every(p=>g.subs[p])) this.endWrite(g); }
  else if(g.step==="vote"){ if(id===g.spot) return; const i=Number(v); if(![0,1,2].includes(i)) return; g.votes[id]=i; SFX.tick(); if(activeIds().filter(p=>p!==g.spot).every(p=>g.votes[p]!=null)) this.reveal(g); }
 },
 endWrite(g){ if(g.step!=="write") return; g.spots=shuffle(Object.keys(g.subs)).slice(0,g.cfg.rounds); if(!g.spots.length){ toast("Nobody wrote anything!"); endGame(); return; } g.total=g.spots.length; this.openSpot(g); renderHost(true); broadcast(); },

 reveal(g){ if(g.step!=="vote") return; g.step="reveal"; g.deadline=null; const lie=g.subs[g.spot].lie; let fooled=0;
  Object.entries(g.votes).forEach(([v,i])=>{ if(i===lie) addScore(v,500); else fooled++; }); if(fooled) addScore(g.spot,250*fooled); g.fooled=fooled; SFX.reveal(); renderHost(true); broadcast(); },
 timeout(g){ if(g.step==="write") this.endWrite(g); else if(g.step==="vote") this.reveal(g); },

 host(g){
  if(g.step==="write") return `${gbar(g,"Start now","EXT.ttl.endWrite(S.game)")}<div class="big-emoji">🤞</div><h2 class="big-q">Write 2 truths and 1 lie about yourself</h2><div class="muted" style="font-size:22px">Make the lie believable and the truths weird 😏</div><div class="pill" id="count">${this.count(g)}</div>`;

function ttlLie(i){ TTL_LIE=i; [0,1,2].forEach(j=>{ const b=$("#lb"+j); if(b){ b.className="small "+(j===i?"pink":"ghost"); b.textContent=j===i?"LIE":"lie?"; } }); }

/* ===================== REACTION TEST ===================== */
EXT.reaction={
 total:cfg=>cfg.rounds,
 round(g,now,ids){
  g.res={}; g.early=[]; g.pen=[]; g.pi=0; g.penQ=null; g.rank=[];
  const d=g.cfg.diff, wait=d==="hard"?1500+Math.random()*8000:2000+Math.random()*5000;
  g.goAt=now+2500+wait; g.decoys=[];
  const nd=d==="easy"?0:d==="medium"?(Math.random()<.4?1:0):(Math.random()<.85?1+Math.floor(Math.random()*2):0);
  for(let i=0;i<nd;i++) g.decoys.push(now+2500+Math.random()*Math.max(200,wait-900));
  g.decoys.sort((a,b)=>a-b); g.flashUntil=0; g.step="wait"; g.start=now; g.deadline=null; SFX.start();
 },
 tick(g,now){
  if(g.step==="flash"&&now>=g.flashUntil){ g.step="wait"; send({k:"flash",rid:g.rid,on:false}); renderHost(true); broadcast(); return; }
  if(g.step==="wait"&&g.decoys.length&&now>=g.decoys[0]&&now<g.goAt-500){ g.decoys.shift(); g.step="flash"; g.flashUntil=now+700; g.fc=pick(["#2b8cff","#ffd23f","#a259ff","#ff8a3d"]); send({k:"flash",rid:g.rid,on:true,c:g.fc}); SFX.boing(); renderHost(true); broadcast(); return; }
  if(g.step==="wait"&&g.decoys.length&&now>=g.goAt-500) g.decoys=[];
  if(g.step==="wait"&&now>=g.goAt){ g.step="go"; g.goTime=now; send({k:"go",rid:g.rid}); SFX.go(); renderHost(true); broadcast(); return; }
  const ids=activeIds();
  if(["wait","flash","go"].includes(g.step)&&ids.length&&ids.every(id=>g.res[id])){ this.result(g); return; }
  if(g.step==="go"&&now>=g.goTime+5000) this.result(g);
 },
 answer(g,id,v){
  if(g.res[id]||!v||!["wait","flash","go"].includes(g.step)) return;
  if(v.early){ g.res[id]={early:true}; g.early.push(id); SFX.buzz(); }
  else if(typeof v.ms==="number"&&g.step==="go"){ g.res[id]={ms:Math.max(0,Math.min(9999,Math.round(v.ms)))}; SFX.pop(); }
  this.live(g);
 },
 result(g){
  g.step="result";
  const taps=Object.entries(g.res).filter(([,r])=>r.ms!=null).map(([id,r])=>({id,ms:r.ms})).sort((a,b)=>a.ms-b.ms);
  [500,300,150].forEach((p,i)=>{ if(taps[i]){ taps[i].pts=addScore(taps[i].id,p); g.res[taps[i].id].pts=taps[i].pts; } });
  g.rank=taps; g.pen=[...g.early];
  if(g.cfg.slow&&taps.length>1){ const sl=taps[taps.length-1].id; if(!g.pen.includes(sl)) g.pen.push(sl); }
  g.pi=0; g.penQ=g.pen.length?nextPenQ():null;
  g.pen.length?SFX.siren():SFX.reveal(); renderHost(true); broadcast();
 },
 next(g){ if(g.pen.length&&g.pi<g.pen.length-1){ g.pi++; g.penQ=nextPenQ(); SFX.siren(); renderHost(true); broadcast(); } else nextRound(); },
 newQ(g){ g.penQ=nextPenQ(); SFX.boing(); renderHost(true); broadcast(); },
 live(g){ const el=$("#early"); if(el) el.textContent=g.early.length?"🚨 Too early: "+g.early.map(id=>S.players[id]?.name).join(", "):""; },
 pub(g,o,ids){ if(g.step==="result"){ o.pen=g.pen[g.pi]||null; o.penQ=g.penQ; } ids.forEach(id=>{ o.priv[id]=g.res[id]||{}; }); },
 done:(g,id)=>!!g.res[id],
 count:g=>`${Object.keys(g.res).length} / ${activeIds().length} tapped`,
 host(g){
  if(["wait","flash","go"].includes(g.step)){
   const fresh=Date.now()-g.start<2400;
   let cls="red", big=fresh?"GET READY...":"WAIT…", sub="Tap your phone the moment this turns <b>GREEN</b>";
   if(g.step==="flash"){ cls="flash"; big="NOT YET! 😈"; sub="That's a trick!"; }
   if(g.step==="go"){ cls="green"; big="TAP!!!"; sub=""; }
   return `${gbar(g)}<div class="rpanel ${cls}" style="${cls==="flash"?`background:${g.fc}`:""}"><div>${big}</div><div class="rsub">${sub}</div></div><div class="muted" id="early" style="font-size:20px">${g.early.length?"🚨 Too early: "+g.early.map(id=>esc(S.players[id]?.name)).join(", "):""}</div>`;
  }
  const rows=g.rank.map((r,i)=>`<div class="board-row"><span class="emo">${["🥇","🥈","🥉"][i]||"⚡"}</span>${pname(r.id)}<span class="muted" style="margin-left:10px">${r.ms} ms</span><span class="sc">${r.pts?"+"+r.pts:""}</span></div>`).join("");
  const er=g.early.map(id=>`<div class="board-row" style="background:#ff547033"><span class="emo">🚨</span>${pname(id)}<span class="sc" style="color:var(--red)">TOO EARLY</span></div>`).join("");
  const pid=g.pen[g.pi], morePen=g.pen.length&&g.pi<g.pen.length-1;
  const lbl=morePen?"Next penalty ▶":(g.idx<g.total?"Next round ▶":"Finish 🏁");
  const pen=pid?`<div class="pencard"><span class="pill" style="background:#ffffff33">🚨 PENALTY ${g.pen.length>1?`${g.pi+1}/${g.pen.length}`:""}</span><h2 style="font-size:34px;margin-top:10px">${pname(pid)}, answer this:</h2><div class="penq">${esc(g.penQ)}</div><button class="ghost small" onclick="EXT.reaction.newQ(S.game)">🎲 Different question</button></div>`:"";
  return `${gbar(g,lbl,"EXT.reaction.next(S.game)")}${pen}<div class="res-list">${rows}${er}${!rows&&!er?'<div class="muted">Nobody tapped 😴</div>':""}</div>`;
 },
 phone(g,pv){
  if(g.step==="result"){
   if(g.pen===P.id) return `<div class="status bad" style="font-size:24px">🚨 HOT SEAT! 🚨</div><h2 class="center" style="font-size:26px">${esc(g.penQ||"")}</h2><div class="muted center">Answer out loud. No escaping 😈</div>`;
   return `<div class="center"><div class="big-emoji">${pv.early?"🚨":pv.ms!=null?"⚡":"😴"}</div><h2>${pv.early?"Too early!":pv.ms!=null?pv.ms+" ms":"No tap!"}</h2>${pv.pts?`<div class="status ok" style="margin-top:10px">+${pv.pts} points</div>`:""}<div class="muted" style="margin-top:8px">${rankLine()}</div></div>`;
  }
  return `<div id="rbtn" class="rbtn red" onpointerdown="rTap(event)"></div>`;
 },
 pafter(g){ this.pupd(g); },
 pupd(g){ if(RX.rid!==g.rid) rReset(g.rid); if(g.step==="go"&&RX.goAt==null) RX.goAt=performance.now(); rPaint(); }
};
function rReset(rid){ RX={rid,goAt:null,flash:false,fc:null,tapped:null}; }
function rTap(e){
  if(e) e.preventDefault(); const g=ST&&ST.g; if(!g||g.type!=="reaction") return;
  if(RX.rid!==g.rid) rReset(g.rid); if(RX.tapped||!["wait","flash","go"].includes(g.step)) return;
  if(RX.goAt!=null){ const ms=Math.round(performance.now()-RX.goAt); RX.tapped={ms}; sendAns({ms}); }
  else { RX.tapped={early:true}; sendAns({early:true}); if(navigator.vibrate) navigator.vibrate([120,60,120]); }
  rPaint();
}
function rPaint(){
  const b=$("#rbtn"); if(!b) return; let cls="red", txt="WAIT…<small>Tap when it turns GREEN</small>";
  if(RX.tapped){ cls="done"; txt=RX.tapped.early?"🚨 TOO EARLY!<small>Penalty incoming 😈</small>":`⚡ ${RX.tapped.ms} ms<small>Nice reflexes!</small>`; }
  else if(RX.goAt!=null){ cls="green"; txt="TAP!!!"; }
  else if(RX.flash){ cls="flash"; txt="NOT YET! 😈"; }
  b.className="rbtn "+cls; b.style.background=cls==="flash"?(RX.fc||"#ffd23f"):""; b.innerHTML=txt;
}

/* ===================== WISH WALL ===================== */
function wishCard(w){ return `<div class="wish" style="background:${w.col};transform:rotate(${w.rot}deg)">${esc(w.t)}<div class="from">${esc(w.emoji)} ${esc(w.name)}</div></div>`; }
EXT.wishes={
 total:()=>1,
 round(g,now){ g.wishes=[]; g.si=0; g.step="collect"; g.start=now; g.deadline=null; },
 answer(g,id,v){
  const t=String(v||"").trim().slice(0,220); if(!t) return; const p=S.players[id];
  const w={id,t,name:p.name,emoji:p.emoji,rot:(Math.random()*6-3).toFixed(1),col:pick(WCOLS)}; g.wishes.push(w); SFX.ding();
  if(g.step==="collect"){ const wall=$("#wall"); if(wall){ const e0=wall.querySelector(".empty"); if(e0) e0.remove(); wall.insertAdjacentHTML("beforeend",wishCard(w)); } const c=$("#wcount"); if(c) c.textContent=g.wishes.length+" wishes"; }
 },
 startShow(g){ if(!g.wishes.length){ toast("No wishes yet! Ask everyone to send one."); return; } g.step="show"; g.si=0; g.nextAt=Date.now()+8000; SFX.fanfare(); confetti(3000); renderHost(true); broadcast(); },
 tick(g,now){ if(g.step==="show"&&now>=g.nextAt){ g.si=(g.si+1)%g.wishes.length; g.nextAt=now+8000; SFX.pop(); if(g.si===0) confetti(2000); renderHost(true); } },
 pub(g,o,ids){ ids.forEach(id=>{ o.priv[id]={n:g.wishes.filter(w=>w.id===id).length}; }); },
 done:(g,id)=>g.wishes.some(w=>w.id===id),
 count:g=>g.wishes.length+" wishes",
 host(g){
  if(g.step==="collect") return `${gbar(g,"Start slideshow ▶","EXT.wishes.startShow(S.game)")}<h2 class="big-q">💌 Birthday Wish Wall</h2><div class="muted" style="font-size:20px">Type your wishes on your phone. Send as many as you like!</div><div class="pill" id="wcount">${g.wishes.length} wishes</div><div class="wall" id="wall">${g.wishes.map(wishCard).join("")||'<div class="muted empty">Wishes will pop up here...</div>'}</div>`;
  const w=g.wishes[g.si];
  return `${gbar(g,"Finish 🎉","endGame()")}<div class="wishbig" style="background:${w.col};transform:rotate(${(w.rot/2).toFixed(1)}deg)"><div>${esc(w.t)}</div><div class="from">With love, ${esc(w.emoji)} ${esc(w.name)}</div></div><div class="muted">${g.si+1} / ${g.wishes.length}</div>`;
 },
 phone(g,pv){ return `<h2 class="center">💌 Send a birthday wish</h2><textarea id="wish" rows="4" maxlength="220" placeholder="Write something sweet (or roast them a little 😜)"></textarea><button class="pink" onclick="wishSend()">Send wish 💌</button>${pv.n?`<div class="status ok">You've sent ${pv.n} wish${pv.n>1?"es":""} 💖 Send more!</div>`:""}`; }
};
function wishSend(){ const t=$("#wish"); if(!t||!t.value.trim()){ if(t){ t.classList.add("shake"); setTimeout(()=>t.classList.remove("shake"),400); } return; } sendAns(t.value.trim()); t.value=""; }


/* ======================= BOOT ========================== */
/* ======================================================= */
function landing(){
  $("#app").innerHTML=`<div class="phone"><div class="phone-body center">
    <div class="big-emoji">🎂🎉</div><h1 class="party-title" style="font-size:48px">Birthday Party Games</h1>
    <div class="muted">11 party games. Laptop hosts, phones play!</div>
    <button class="pink" onclick="hostNew()">💻 Host on this laptop</button>
    <div class="muted" style="margin-top:10px">Joining from a phone?</div>
    <div class="row"><input id="rc" placeholder="Room code" maxlength="6" style="text-transform:uppercase"><button onclick="joinCode()">Join</button></div>
  </div></div>`;
}
function hostNew(){ audio(); const prev=lsGet("bday-last-room",null); const code=prev||Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random()*24)]).join(""); lsSet("bday-last-room",code); history.replaceState(null,"","?host="+code); startHost(code); }
function joinCode(){ const c=$("#rc").value.trim().toUpperCase(); if(c){ history.replaceState(null,"","?room="+c); startPlayer(c);} }
document.addEventListener("click",()=>audio(),{once:true});

if(params.get("host")) startHost(params.get("host").toUpperCase());
else if(params.get("room")) startPlayer(params.get("room").toUpperCase());
else landing();
</script>
